<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <form id="scoreForm" action="" class="w-80 mx-auto mt-10 shadow p-10">
        <div>
            <label for="score" class="w-full form-label p-3">Score</label>
            <input type="text" id="score" class="w-full border border-2 p-3" placeholder="Enter your score">
        </div>
        <p id="grade"></p>
        <input type="submit" class="border p-3 mt-5 mx-auto w-full hover:bg-green-200 cursor-pointer">
    </form>

    <form id="scoreForm2" action="" class="w-80 mx-auto mt-10 shadow p-10">
        <div>
            <label for="score2" class="w-full form-label p-3">Switch Score</label>
            <input type="text" id="score2" class="w-full border border-2 p-3" placeholder="Enter your score">
        </div>
        <p id="grade2"></p>
        <input type="submit" class="border p-3 mt-5 mx-auto w-full hover:bg-green-200 cursor-pointer">
    </form>

    <form id="trafficForm" action="" class="w-80 mx-auto mt-10 shadow p-10">
        <div>
            <label for="color" class="w-full form-label p-3">Color</label>
            <input type="text" id="color" class="w-full border border-2 p-3" placeholder="Enter your score">
        </div>
        <p id="result"></p>
        <input type="submit" class="border p-3 mt-5 mx-auto w-full hover:bg-green-200 cursor-pointer">
    </form>

    <script src="WK3-1-remaining-conditional-statement.js"></script>
</body>
</html>
